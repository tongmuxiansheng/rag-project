<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 知识库系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }
        .header p {
            font-size: 13px;
            opacity: 0.9;
            margin-top: 4px;
        }
        .container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        .sidebar {
            width: 320px;
            background: white;
            border-right: 1px solid #e8e8e8;
            padding: 20px;
            overflow-y: auto;
        }
        .sidebar h2 {
            font-size: 16px;
            margin-bottom: 16px;
            color: #333;
        }
        .upload-area {
            border: 2px dashed #d9d9d9;
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafafa;
        }
        .upload-area:hover {
            border-color: #667eea;
            background: #f0f2ff;
        }
        .upload-area.dragover {
            border-color: #667eea;
            background: #e8ebff;
        }
        .upload-icon {
            font-size: 36px;
            margin-bottom: 10px;
        }
        .upload-area p {
            font-size: 14px;
            color: #666;
        }
        .upload-area .hint {
            font-size: 12px;
            color: #999;
            margin-top: 6px;
        }
        #fileInput {
            display: none;
        }
        .upload-status {
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            display: none;
        }
        .upload-status.success {
            background: #f6ffed;
            color: #52c41a;
            border: 1px solid #b7eb8f;
            display: block;
        }
        .upload-status.error {
            background: #fff2f0;
            color: #ff4d4f;
            border: 1px solid #ffccc7;
            display: block;
        }
        .upload-status.loading {
            background: #e6f7ff;
            color: #1890ff;
            border: 1px solid #91d5ff;
            display: block;
        }
        .stats {
            margin-top: 24px;
            padding: 16px;
            background: #fafafa;
            border-radius: 8px;
        }
        .stats-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
        }
        .stats-item .label {
            color: #666;
        }
        .stats-item .value {
            font-weight: 600;
            color: #667eea;
        }
        .clear-btn {
            margin-top: 12px;
            width: 100%;
            padding: 8px;
            background: #fff;
            border: 1px solid #ffccc7;
            color: #ff4d4f;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        .clear-btn:hover {
            background: #fff2f0;
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }
        .message {
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
        }
        .message.user {
            flex-direction: row-reverse;
        }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .message.user .avatar {
            background: #667eea;
            color: white;
        }
        .message.assistant .avatar {
            background: #f0f0f0;
        }
        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
        }
        .message.user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.assistant .message-content {
            background: #f5f7fa;
            border-bottom-left-radius: 4px;
        }
        .message.assistant .message-content.rejected {
            background: #fff7e6;
            border: 1px solid #ffd591;
        }
        .confidence {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #e8e8e8;
            font-size: 12px;
        }
        .confidence-label {
            color: #666;
        }
        .confidence-value {
            font-weight: 600;
        }
        .confidence-high { color: #52c41a; }
        .confidence-medium { color: #fa8c16; }
        .confidence-low { color: #ff4d4f; }
        .message-content .sources {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e8e8e8;
            font-size: 12px;
            color: #999;
        }
        .message-content .sources-title {
            font-weight: 600;
            margin-bottom: 6px;
            color: #666;
        }
        .message-content .source-item {
            padding: 2px 0;
        }
        .typing {
            display: inline-block;
            width: 20px;
            height: 12px;
            position: relative;
        }
        .typing span {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #999;
            position: absolute;
            animation: typing 1.4s infinite;
        }
        .typing span:nth-child(1) { left: 0; animation-delay: 0s; }
        .typing span:nth-child(2) { left: 7px; animation-delay: 0.2s; }
        .typing span:nth-child(3) { left: 14px; animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }
        .chat-input {
            padding: 16px 24px;
            border-top: 1px solid #e8e8e8;
            display: flex;
            gap: 12px;
            background: white;
        }
        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .chat-input input:focus {
            border-color: #667eea;
        }
        .chat-input button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.3s;
        }
        .chat-input button:hover {
            background: #5568d3;
        }
        .chat-input button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>RAG 知识库系统</h1>
        <p>基于检索增强生成的智能问答系统 | 支持 PDF / Word / TXT</p>
    </div>
    <div class="container">
        <div class="sidebar">
            <h2>文档上传</h2>
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📄</div>
                <p>点击或拖拽文件到此处上传</p>
                <p class="hint">支持 .pdf / .docx / .txt</p>
            </div>
            <input type="file" id="fileInput" accept=".pdf,.docx,.txt">
            <div class="upload-status" id="uploadStatus"></div>

            <div class="stats">
                <div class="stats-item">
                    <span class="label">知识库文档数</span>
                    <span class="value" id="docCount">-</span>
                </div>
                <div class="stats-item">
                    <span class="label">系统状态</span>
                    <span class="value" id="systemStatus" style="color: #52c41a;">运行中</span>
                </div>
            </div>
            <button class="clear-btn" onclick="clearDatabase()">清空知识库</button>
        </div>
        <div class="chat-area">
            <div class="chat-messages" id="chatMessages">
                <div class="message assistant">
                    <div class="avatar">🤖</div>
                    <div class="message-content">
                        你好！我是 RAG 知识库助手。请先在左侧上传文档，然后就可以向我提问了。
                    </div>
                </div>
            </div>
            <div class="chat-input">
                <input type="text" id="questionInput" placeholder="输入你的问题，按回车发送..." onkeypress="handleKeyPress(event)">
                <button onclick="sendQuestion()" id="sendBtn">发送</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';

        // 页面加载时获取文档数量
        window.onload = function() {
            updateDocCount();
        };

        // 上传区域点击
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        uploadArea.addEventListener('click', () => fileInput.click());

        // 拖拽上传
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) uploadFile(file);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) uploadFile(file);
        });

        // 上传文件
        async function uploadFile(file) {
            const statusEl = document.getElementById('uploadStatus');
            statusEl.className = 'upload-status loading';
            statusEl.textContent = '正在处理文档，请稍候...';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(`${API_BASE}/upload`, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();

                if (response.ok) {
                    statusEl.className = 'upload-status success';
                    statusEl.textContent = `✓ ${result.message}`;
                    updateDocCount();
                } else {
                    statusEl.className = 'upload-status error';
                    statusEl.textContent = `✗ 上传失败: ${result.detail || '未知错误'}`;
                }
            } catch (error) {
                statusEl.className = 'upload-status error';
                statusEl.textContent = `✗ 上传失败: ${error.message}`;
            }
        }

        // 更新文档数量
        async function updateDocCount() {
            try {
                const response = await fetch(`${API_BASE}/documents`);
                const result = await response.json();
                document.getElementById('docCount').textContent = result.count;
            } catch (error) {
                document.getElementById('docCount').textContent = '获取失败';
            }
        }

        // 清空知识库
        async function clearDatabase() {
            if (!confirm('确定要清空知识库吗？此操作不可恢复。')) return;
            try {
                await fetch(`${API_BASE}/clear`, { method: 'DELETE' });
                updateDocCount();
                alert('知识库已清空');
            } catch (error) {
                alert('清空失败: ' + error.message);
            }
        }

        // 回车发送
        function handleKeyPress(event) {
            if (event.key === 'Enter') sendQuestion();
        }

        // 发送问题
        async function sendQuestion() {
            const input = document.getElementById('questionInput');
            const question = input.value.trim();
            if (!question) return;

            // 添加用户消息
            addMessage(question, 'user');
            input.value = '';

            // 显示加载中
            const loadingId = addLoadingMessage();

            try {
                const response = await fetch(`${API_BASE}/query`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question, top_k: 3 })
                });
                const result = await response.json();

                // 移除加载消息
                document.getElementById(loadingId).remove();

                if (response.ok) {
                    addMessage(result.answer, 'assistant', result.sources, result.confidence, result.answered);
                } else {
                    addMessage(`抱歉，回答失败: ${result.detail || '未知错误'}`, 'assistant');
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                addMessage(`抱歉，网络错误: ${error.message}`, 'assistant');
            }
        }

        // 添加消息
        function addMessage(content, role, sources = null, confidence = null, answered = true) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = role === 'user' ? '👤' : '🤖';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            if (role === 'assistant' && !answered) {
                contentDiv.classList.add('rejected');
            }
            contentDiv.textContent = content;

            // 显示置信度
            if (confidence !== null && confidence !== undefined) {
                const confDiv = document.createElement('div');
                confDiv.className = 'confidence';
                let confClass = 'confidence-low';
                let confText = '较低';
                if (confidence >= 0.5) {
                    confClass = 'confidence-high';
                    confText = '较高';
                } else if (confidence >= 0.35) {
                    confClass = 'confidence-medium';
                    confText = '中等';
                }
                confDiv.innerHTML = `<span class="confidence-label">置信度: </span><span class="confidence-value ${confClass}">${(confidence * 100).toFixed(1)}% (${confText})</span>`;
                contentDiv.appendChild(confDiv);
            }

            // 显示来源
            if (sources && sources.length > 0) {
                const sourcesDiv = document.createElement('div');
                sourcesDiv.className = 'sources';
                sourcesDiv.innerHTML = '<div class="sources-title">参考来源:</div>';
                sources.forEach((src, i) => {
                    const item = document.createElement('div');
                    item.className = 'source-item';
                    item.textContent = `${i + 1}. ${src.source || '未知文档'} (块${src.chunk_id ?? '?'})`;
                    sourcesDiv.appendChild(item);
                });
                contentDiv.appendChild(sourcesDiv);
            }

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // 添加加载消息
        function addLoadingMessage() {
            const chatMessages = document.getElementById('chatMessages');
            const id = 'loading-' + Date.now();
            const messageDiv = document.createElement('div');
            messageDiv.id = id;
            messageDiv.className = 'message assistant';
            messageDiv.innerHTML = `
                <div class="avatar">🤖</div>
                <div class="message-content">
                    <div class="typing"><span></span><span></span><span></span></div>
                </div>
            `;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
